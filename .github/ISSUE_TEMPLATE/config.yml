# Issue template configuration.
#
# Blank issues are disabled so contributors pick a structured template (bug
# report or feature request). Security reports are routed to the private
# disclosure policy rather than a public issue.

blank_issues_enabled: false

contact_links:
  - name: Security report
    url: https://github.com/pianosuki/kith/security/policy
    about: Report a vulnerability privately. Do not open a public issue.
