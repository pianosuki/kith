# Weekly line-coverage lane: clang source-based coverage (llvm-cov) over the
# shared libraries and coverage.py over the handwritten Python package,
# including optional examples. Generated Python bindings are omitted.
#
# Coverage is reported, not gated (AGENTS.md §4.2): totals land in the job
# summary with the targets printed beside them, and the HTML reports ride as
# artifacts. Trend data on a reported metric does not justify a per-push
# session, so this lane runs weekly; the sanitizer and fuzzing legs run in
# their own weekly lane.
#
# The postgres service backs the Python-driven legs (the KITH_PG_* env
# points the db pool at it); the C and Python legs share one C-core number
# through the shared LLVM_PROFILE_FILE namespace.

name: coverage

on:
  schedule:
    - cron: '0 4 * * 1'  # Monday 04:00 UTC, clear of the stress window
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage report (llvm-cov + coverage.py)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14.10", "3.15.2"]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Mirrors the postgres service definition and KITH_PG_* environment
    # declared in ci.yml. YAML anchors do not reach across workflow files,
    # so the block is duplicated per job; keep every copy in sync. Only
    # the Python-driven legs need it.
    services:
      postgres:
        image: postgres:18.6@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_USER: kith
          POSTGRES_PASSWORD: kith
          POSTGRES_DB: kith_example
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kith -d kith_example"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KITH_PYTHON_VERSION: ${{ matrix.python }}
      KITH_PG_HOST: 127.0.0.1
      KITH_PG_PORT: "5432"
      KITH_PG_USER: kith
      KITH_PG_PASSWORD: kith
      KITH_PG_DB: kith_example
      # Every process that loads the instrumented libraries appends one
      # profile variant per module (%m); the C and Python legs share the
      # namespace so their execution merges into a single C-core number.
      LLVM_PROFILE_FILE: ${{ github.workspace }}/profraw/c-%m.profraw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Cache pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-sanitizers-${{ hashFiles('scripts/provision-ci.sh') }}
          restore-keys: |
            pip-${{ runner.os }}-sanitizers-
      - name: Provision (LLVM 23.1.5 toolchain, llvm-cov, dev libs, cmake, pytest, coverage)
        run: ./scripts/provision-ci.sh coverage
      - name: Configure (coverage preset)
        run: cmake --preset coverage
      - name: Build (coverage preset)
        run: cmake --build --preset coverage
      - name: Test the C suite under source-based coverage
        run: |
          set -euo pipefail
          # C and Python profiles share this directory for the final merge.
          mkdir -p "$PWD/profraw"
          ctest --preset coverage --output-log coverage-ctest.log
      - name: Test the Python framework suite under coverage.py
        run: |
          set -euo pipefail
          export KITH_BUILD_DIR="$PWD/build/coverage"
          export KITH_PROTO_LIB="$PWD/build/coverage/libkith_proto.so.1"
          export KITH_CLIENT_LIB="$PWD/build/coverage/libkith_client.so.1"
          python -m coverage debug sys
          python -m coverage run -m pytest tests/python tests/integration -q \
              | tee python-coverage-pytest.log
      - name: Combine Python parent and child measurements
        run: python -m coverage combine --keep
      - name: Report C core line coverage
        run: |
          set -euo pipefail
          llvm-profdata merge -sparse profraw/*.profraw -o kith.profdata
          # The report is scoped to the shared libraries: they are the only
          # form the framework ships in, so their mapping is exactly the C
          # core covered by AGENTS.md §4.2's review target. The profiles carry the
          # execution of both test legs (C suite and Python-driven).
          # Additional objects must ride -object flags; positional arguments
          # after the first binary are source filters, not objects.
          libs=(build/coverage/libkith_*.so)
          objects=()
          for so in "${libs[@]:1}"; do
              objects+=(-object "$so")
          done
          {
            echo '### C core line coverage (C and Python suites combined)'
            echo 'Scope: all shipped libkith shared libraries and their mapped executable header lines.'
            echo '```'
            llvm-cov report --instr-profile=kith.profdata \
                "${libs[0]}" "${objects[@]}"
            echo '```'
            echo 'Target: >= 85% line coverage for the C core; reported, not gated.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate the C coverage HTML report
        run: |
          libs=(build/coverage/libkith_*.so)
          objects=()
          for so in "${libs[@]:1}"; do
              objects+=(-object "$so")
          done
          llvm-cov show --format=html --output-dir=coverage-html \
              --instr-profile=kith.profdata "${libs[0]}" "${objects[@]}"
      - name: Report Python scope diagnostics
        run: |
          set -euo pipefail
          python -m coverage json -o python-coverage.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path("python-coverage.json").read_text(encoding="utf-8"))
          groups = {
              "Package aggregate": [0, 0, 0, 0],
              "Framework excluding examples": [0, 0, 0, 0],
              "Examples": [0, 0, 0, 0],
          }
          for filename, result in data["files"].items():
              relative = ("/" + filename.replace("\\", "/")).rpartition("/kith/")[2]
              group = "Examples" if relative.startswith("examples/") else "Framework excluding examples"
              summary = result["summary"]
              counts = [summary["covered_lines"], summary["num_statements"],
                        summary.get("covered_branches", 0), summary.get("num_branches", 0)]
              for scope in (group, "Package aggregate"):
                  groups[scope] = [a + b for a, b in zip(groups[scope], counts)]

          print("### Python statement and branch coverage")
          print()
          print("Framework line target: >= 90%, reported, not gated. Branches have no numeric target.")
          print("Scope: handwritten python/kith; generated bindings omitted; examples reported separately.")
          print()
          print("| Scope | Covered statements | Executable statements | Line coverage | Branch coverage |")
          print("| --- | ---: | ---: | ---: | ---: |")
          for group, (covered, statements, covered_branches, branches) in groups.items():
              lines = f"{100 * covered / statements:.2f}%" if statements else "N/A"
              arcs = f"{100 * covered_branches / branches:.2f}%" if branches else "N/A"
              print(f"| {group} | {covered} | {statements} | {lines} | {arcs} |")
          PY
      - name: Generate the Python coverage HTML report
        run: python -m coverage html -d python-coverage-html
      - name: Upload raw Python coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-data-${{ matrix.python }}
          include-hidden-files: true
          path: |
            .coverage
            .coverage.*
            .coveragerc
            python-coverage.json
            python-coverage-pytest.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the coverage ctest log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ctest-log-${{ matrix.python }}
          path: coverage-ctest.log
          if-no-files-found: error
          retention-days: 7
      - name: Upload the coverage HTML reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html-reports-${{ matrix.python }}
          path: |
            coverage-html/
            python-coverage-html/
          if-no-files-found: ignore
          retention-days: 7
