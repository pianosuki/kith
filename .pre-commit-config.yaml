minimum_pre_commit_version: '3.0.0'
default_install_hook_types: [pre-commit, pre-push, commit-msg]

# Local python hooks run under language: python so pre-commit owns their
# environment: each hook installs its declared additional_dependencies into an
# isolated, version-pinned virtualenv, independent of the developer's project
# venv or system python. Only clang-tidy stays language: system because it
# needs the full host clang 22 C toolchain and compile database. The ctypes
# drift hook runs under language: python with the clang2 pip wheel (LLVM 22
# python bindings) but still loads the system libclang1-22 C library and
# invokes the clang-22 driver for system-include discovery.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=100]
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.0
    hooks:
      - id: clang-format
        types_or: [c]
        exclude: '^third_party/'
        # Verify-only: dry-run + Werror reports violations without rewriting
        # the working tree. The fix path is `cmake --build --target format`
        # or `scripts/format.sh`; a gate never mutates files.
        args: [--dry-run, --Werror]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      # Shell scripts join the gate at warning severity; notes stay
      # informational. The platform wheels bundle the shellcheck binary,
      # so the hook's environment needs no runtime download.
      - id: shellcheck
        args: [--severity=warning]

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy (run via scripts/run-clang-tidy.sh)
        entry: ./scripts/run-clang-tidy.sh
        language: system
        types_or: [c]
        pass_filenames: false
        stages: [manual]

      - id: check-module-layers
        name: dependency-layer enforcement
        entry: python tools/check_module_layers.py include src
        language: python
        pass_filenames: false
        files: '\.(c|h)$'

      - id: check-runtime-planes
        name: runtime-plane invariant enforcement
        entry: python tools/check_runtime_planes.py
        language: python
        additional_dependencies: [pyyaml, clang2==22.1.8.post0]
        pass_filenames: false
        files: '\.(c|h)$'

      - id: check-public-api
        name: public API contract enforcement
        entry: python tools/check_public_api.py
        language: python
        additional_dependencies: [clang2==22.1.8.post0]
        pass_filenames: false
        files: '\.(c|h)$'

      - id: check-layout-consistency
        name: layout consistency
        entry: python tools/check_layout_consistency.py include src
        language: python
        pass_filenames: false
        files: '\.(c|h)$'

      - id: check-public-api-includes
        name: cross-module deep-include enforcement
        entry: python tools/check_public_api_includes.py include src
        language: python
        pass_filenames: false
        files: '\.(c|h)$'

      - id: check-internal-includes
        name: cross-module internal-header include enforcement
        entry: python tools/check_internal_includes.py include src
        language: python
        pass_filenames: false
        files: '\.(c|h)$'

      - id: check-comments
        name: comment philosophy enforcement
        entry: python tools/check_comments.py
        language: python
        pass_filenames: true
        files: '\.(c|h|py|ya?ml|cmake)$|(^|/)CMakeLists\.txt$'
        exclude: '^tools/fixtures/'

      - id: check-trivial-fixers
        name: trivial whitespace/line-ending/BOM compliance
        entry: python tools/check_trivial_fixers.py
        language: python
        pass_filenames: true
        files: '\.(c|h|py)$'
        exclude: '^third_party/|^tools/fixtures/'

      - id: check-ctypes-drift
        name: ctypes binding drift
        entry: python tools/check_ctypes_drift.py
        language: python
        # clang2 ships the LLVM 22 python bindings (clang.cindex) as a
        # pure-Python wheel; libclang1-22 (the C library) and the clang-22
        # driver are still required from the system, but the python bindings
        # are owned by this hook's isolated env, not the system python.
        # ruff is required because the generator formats its output with
        # `ruff format` and `ruff check --fix` before comparing against the
        # checked-in bindings; without it the generated files are unformatted
        # and every header change looks like a spurious drift.
        additional_dependencies: [clang2==22.1.8.post0, ruff==0.16.7]
        pass_filenames: false
        files: 'include/kith/.*\.(h)$'

      - id: check-forbidden-patterns
        name: forbidden patterns and anti-patterns
        entry: python tools/check_forbidden_patterns.py
        language: python
        pass_filenames: true
        files: '\.(c|h|py|md)$'
        exclude: '^tools/fixtures/'

      - id: check-adr-style
        name: architecture-record house style
        entry: python tools/check_adr_style.py
        language: python
        pass_filenames: true
        files: '^docs/architecture/adr/.*\.md$'

      - id: check-changelog-version
        name: changelog version lockstep
        entry: python tools/check_changelog_version.py
        language: python
        pass_filenames: false
        files: '^(CHANGELOG\.md|CMakeLists\.txt)$'

      - id: check-replay-codec-imports
        name: replay codec stdlib-only enforcement
        entry: python tools/check_replay_codec_imports.py
        language: python
        pass_filenames: false
        files: '^examples/_common/replay_.*\.py$'

      - id: check-markdown-links
        name: markdown link checker
        entry: python tools/check_markdown_links.py
        language: python
        pass_filenames: false
        files: '\.md$'

      - id: vermin
        name: vermin (minimum python version)
        entry: vermin --target=3.14- --no-tips .
        language: python
        additional_dependencies: [vermin]
        pass_filenames: false
        types_or: [python]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      # Verify-only: neither hook fixes. `ruff check` reports lint
      # violations and exits non-zero; `ruff format --check` reports
      # formatting drift without rewriting. The fix path is
      # `cmake --build --target format` or `scripts/format.sh`.
      - id: ruff
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies: [pytest>=9.1.1]
        stages: [pre-push]
        exclude: '^tools/fixtures/'

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: '^third_party/'

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - --force-scope
          - --verbose
          - --scopes=util,config,logger,metrics,net,proto,reactor,worker,state,db,aoi,sim,fabric,gateway,coord,control,client,server,examples,framework,tools
          - feat
          - fix
          - perf
          - refactor
          - test
          - docs
          - build
          - ci
          - chore
          - revert

  - repo: local
    hooks:
      - id: dco-signoff
        name: DCO sign-off auto-append
        description: Appends the missing Signed-off-by trailer to the commit message being created.
        entry: python tools/dco_signoff.py
        language: python
        stages: [commit-msg]

      - id: check-commit-messages
        name: commit message and DCO conformance
        description: Validates conventional header, DCO sign-off, and signing over the commit being created.
        entry: python tools/check_commit_messages.py --message
        language: python
        stages: [commit-msg]

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        stages: [manual]
